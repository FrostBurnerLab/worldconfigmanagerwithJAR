plugins {
	id 'java-library'
}

base {
	archivesName = 'worldconfigmanager-core'
}

dependencies {
	// Minecraft ships Gson at runtime; the core only compiles against it.
	compileOnly "com.google.code.gson:gson:${project.gson_version}"
	compileOnly "org.slf4j:slf4j-api:${project.slf4j_version}"

	testImplementation "com.google.code.gson:gson:${project.gson_version}"
	testImplementation "org.slf4j:slf4j-api:${project.slf4j_version}"
	testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events = ['failed']
		exceptionFormat = 'full'
	}
}
